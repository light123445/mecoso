<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog — Mecoso Handcrafted</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="wordmark-btn">
    <img src="assets/logo_text.jpeg" alt="Mecoso Handcrafted" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'wordmark-text',textContent:'Mecoso Handcrafted'}))">
  </a>
  <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span><span class="menu-badge"></span></button>
</nav>

<div class="scrim"></div>
<div class="nav-drawer">
  <a href="index.html">Home</a>
  <a href="catalog.html">Catalog</a>
  <a href="cart.html">Cart <span class="drawer-cart-count"></span></a>
</div>

<div class="page-wrap">
  <div class="page-header">
    <div class="eyebrow">The Collection</div>
    <h1>Handcrafted Bags</h1>
    <div class="rule"></div>
  </div>

  <div class="filter-row">
    <div class="select-wrap">
      <select id="skinFilter">
        <option value="all">All Skins</option>
      </select>
    </div>
  </div>

  <div class="product-grid" id="productGrid"></div>

  <div class="catalog-checkout-cta">
    <div class="rule"></div>
    <a href="cart.html" class="btn-gold">Checkout <span id="catalogCartCount"></span></a>
  </div>
</div>

<footer class="site-footer">Mecoso Handcrafted &middot; Every piece painted, cut and stitched by hand</footer>

<script src="js/cart.js"></script>
<script>
  const grid = document.getElementById('productGrid');
  const filter = document.getElementById('skinFilter');
  grid.innerHTML = '<div class="no-results">Loading the collection…</div>';

  function populateCategoryOptions() {
    filter.querySelectorAll('option:not([value="all"])').forEach(o => o.remove());
    CATEGORIES.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat.value;
      opt.textContent = cat.label;
      filter.appendChild(opt);
    });
  }

  function render() {
    const val = filter.value;
    const list = val === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === val);
    if (!list.length) {
      grid.innerHTML = '<div class="no-results">No bags in this catalog yet.</div>';
      return;
    }
    grid.innerHTML = list.map(p => `
      <div class="product-card" data-id="${p.id}">
        <div class="img-wrap"><img src="${p.img}" alt="${p.name}"></div>
        <div class="product-info">
          <div class="cat-tag">${p.categoryLabel}</div>
          <h3>${p.name}</h3>
          <p class="desc">${p.desc}</p>
          <div class="price">${formatNaira(p.price)}</div>
          <button class="btn-outline" onclick="handleAdd('${p.id}', this)">Add to Cart</button>
        </div>
      </div>
    `).join('');
  }

  function handleAdd(id, btn) {
    addToCart(id);
    const original = btn.textContent;
    btn.textContent = 'Added ✓';
    btn.classList.add('added');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('added');
    }, 1200);
  }

  function updateCatalogCheckoutLabel() {
    const c = cartCount();
    const el = document.getElementById('catalogCartCount');
    el.textContent = c > 0 ? `(${c})` : '';
  }

  (async function () {
    await catalogReady;
    populateCategoryOptions();
    filter.addEventListener('change', render);
    render();
    updateCatalogCheckoutLabel();
  })();

  const origUpdateBadge = updateCartBadge;
  updateCartBadge = function(animate) {
    origUpdateBadge(animate);
    updateCatalogCheckoutLabel();
  };
</script>
</body>
</html>
