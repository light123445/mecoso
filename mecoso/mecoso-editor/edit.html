<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit — Mecoso Editor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap">
  <div class="dash-topbar">
    <a href="dashboard.html" class="logout-link">← Dashboard</a>
  </div>

  <div class="page-header">
    <div class="eyebrow">Edit</div>
    <h1>Find a Bag to Edit</h1>
    <div class="rule"></div>
  </div>

  <div class="manage-search">
    <input type="text" id="searchInput" placeholder="Search by bag name...">
  </div>

  <div class="manage-grid" id="grid"></div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box" style="max-width:480px; text-align:left;">
    <h3 style="text-align:center">Edit Bag</h3>
    <div class="sub" style="text-align:center">Update the details below</div>

    <label class="img-drop" for="editImgInput" id="editImgDrop" style="display:block; margin-bottom:20px;">
      <div id="editImgPreviewWrap"></div>
      <div class="hint">Click to replace image</div>
    </label>
    <input type="file" id="editImgInput" accept="image/*" style="display:none">

    <div class="form-group">
      <label>Name</label>
      <input type="text" id="editName">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="editDesc"></textarea>
    </div>
    <div class="form-group">
      <label>Price (₦)</label>
      <input type="number" id="editPrice" min="0">
    </div>
    <div class="form-error" id="editError">All fields are required.</div>

    <div class="modal-actions">
      <button class="btn-ghost" id="editCancelBtn">Cancel</button>
      <button class="btn-gold-full" id="editSaveBtn">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="savedModal">
  <div class="modal-box">
    <div class="checkmark-circle" style="margin:0 auto 20px;">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg>
    </div>
    <h3>Changes Saved</h3>
    <div class="sub">The catalog has been updated on the website.</div>
    <button class="btn-gold-full" id="savedOkBtn">Done</button>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script>
  requireLogin();

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  let editingId = null;
  let editingImg = '';

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const products = getProducts().filter(p => p.name.toLowerCase().includes(q));
    if (!products.length) {
      grid.innerHTML = '<div class="no-results">No bags found.</div>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="manage-card">
        <div class="img-wrap"><img src="${p.img}" alt="${p.name}"></div>
        <div class="m-info">
          <div class="m-cat">${p.categoryLabel || p.category}</div>
          <h4>${p.name}</h4>
          <div class="m-price">${formatNaira(p.price)}</div>
          <button class="btn-outline" onclick="openEdit('${p.id}')">Edit</button>
        </div>
      </div>
    `).join('');
  }

  function openEdit(id) {
    const p = getProducts().find(p => p.id === id);
    if (!p) return;
    editingId = id;
    editingImg = p.img;
    document.getElementById('editImgPreviewWrap').innerHTML = `<img src="${p.img}" alt="preview">`;
    document.getElementById('editName').value = p.name;
    document.getElementById('editDesc').value = p.desc;
    document.getElementById('editPrice').value = p.price;
    document.getElementById('editError').style.display = 'none';
    document.getElementById('editModal').classList.add('open');
  }

  document.getElementById('editImgDrop').addEventListener('click', () => document.getElementById('editImgInput').click());
  document.getElementById('editImgInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    readAndCompressImage(file).then(dataUrl => {
      editingImg = dataUrl;
      document.getElementById('editImgPreviewWrap').innerHTML = `<img src="${editingImg}" alt="preview">`;
    });
  });

  document.getElementById('editCancelBtn').addEventListener('click', () => {
    document.getElementById('editModal').classList.remove('open');
  });

  document.getElementById('editSaveBtn').addEventListener('click', () => {
    const name = document.getElementById('editName').value.trim();
    const desc = document.getElementById('editDesc').value.trim();
    const price = Number(document.getElementById('editPrice').value);
    const err = document.getElementById('editError');
    if (!name || !desc || !price || price <= 0 || !editingImg) {
      err.textContent = 'All fields are required.';
      err.style.display = 'block';
      return;
    }
    const ok = updateProduct(editingId, { name, desc, price, img: editingImg });
    if (!ok) {
      err.textContent = "Couldn't save — your browser's storage may be full. Try a smaller image or clear old data.";
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    document.getElementById('editModal').classList.remove('open');
    document.getElementById('savedModal').classList.add('open');
    render();
  });

  document.getElementById('savedOkBtn').addEventListener('click', () => {
    document.getElementById('savedModal').classList.remove('open');
  });

  searchInput.addEventListener('input', render);
  render();
</script>
</body>
</html>
