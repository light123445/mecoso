<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Catalog — Mecoso Editor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap">
  <div class="dash-topbar">
    <a href="add.html" class="logout-link">← Back</a>
  </div>

  <div class="page-header">
    <div class="eyebrow">Add Catalog</div>
    <h1>New Category</h1>
    <div class="rule"></div>
  </div>

  <div class="wizard-card" id="formView">
    <p style="text-align:center; font-family:'Jost',sans-serif; font-size:0.9rem; color:rgba(243,233,210,0.7); margin-bottom:30px;">
      What do you want to add to the catalog? This will appear as a new skin option on the website.
    </p>
    <div class="form-group">
      <label>Catalog Name <span class="required-mark">*</span></label>
      <input type="text" id="catName" placeholder="e.g. Alligator Skin">
    </div>
    <div class="form-error" id="catError">Please enter a catalog name.</div>

    <div class="catalog-preview-list" id="existingCats"></div>

    <button class="btn-gold-full" id="saveCatBtn">Save</button>
    <button class="btn-ghost" style="margin-top:12px" id="cancelCatBtn">Cancel</button>
  </div>

  <div class="wizard-card success-panel" id="successView" style="display:none">
    <div class="checkmark-circle" style="margin:0 auto 24px;">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg>
    </div>
    <div class="thanks-text">Catalog added</div>
    <div class="thanks-sub" style="margin-bottom:30px">It's now live on the website's filter dropdown</div>
    <a href="add.html" class="btn-gold">Add Something Else</a>
  </div>
</div>

<div class="modal-overlay" id="cancelModal">
  <div class="modal-box">
    <h3>Are you sure?</h3>
    <div class="sub">This will discard what you've entered.</div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelNo">No, go back</button>
      <button class="btn-gold-full" id="cancelYes">Yes, cancel</button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script>
  requireLogin();

  function renderExisting() {
    const cats = getCategories();
    document.getElementById('existingCats').innerHTML =
      '<strong style="color:var(--gold-light)">Current catalog:</strong><br>' +
      cats.map(c => c.label).join(' &middot; ');
  }

  document.getElementById('saveCatBtn').addEventListener('click', async () => {
    const name = document.getElementById('catName').value.trim();
    const err = document.getElementById('catError');
    if (!name) {
      err.textContent = 'Please enter a catalog name.';
      err.style.display = 'block';
      return;
    }
    const saveBtn = document.getElementById('saveCatBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    try {
      await addCategory(name);
      err.style.display = 'none';
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } catch (e) {
      err.textContent = e.message || "Couldn't save that catalog. Please try again.";
      err.style.display = 'block';
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
    }
  });

  const cancelModal = document.getElementById('cancelModal');
  document.getElementById('cancelCatBtn').addEventListener('click', () => cancelModal.classList.add('open'));
  document.getElementById('cancelNo').addEventListener('click', () => cancelModal.classList.remove('open'));
  document.getElementById('cancelYes').addEventListener('click', () => window.location.href = 'add.html');

  (async function () {
    document.getElementById('existingCats').textContent = 'Loading current catalog…';
    try {
      await fetchCatalog();
      renderExisting();
    } catch (e) {
      document.getElementById('existingCats').textContent = "Couldn't load the current catalog list.";
    }
  })();
</script>
</body>
</html>
