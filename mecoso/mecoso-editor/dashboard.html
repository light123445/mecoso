<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Mecoso Editor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap">
  <div class="dash-topbar">
    <a href="#" class="logout-link" id="logoutBtn">Log out</a>
  </div>

  <div class="page-header">
    <div class="eyebrow">Mecoso Editor</div>
    <h1>What would you like to do?</h1>
    <div class="rule"></div>
  </div>

  <div class="dash-grid">
    <a href="add.html" class="dash-btn">
      <div class="dash-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      <h3>Add</h3>
      <p>Add a new bag or a new catalog</p>
    </a>
    <a href="edit.html" class="dash-btn">
      <div class="dash-icon"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
      <h3>Edit</h3>
      <p>Update an existing bag</p>
    </a>
    <a href="delete.html" class="dash-btn">
      <div class="dash-icon"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></div>
      <h3>Delete</h3>
      <p>Remove a bag from the catalog</p>
    </a>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  requireLogin();
  document.getElementById('logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    logOut();
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
