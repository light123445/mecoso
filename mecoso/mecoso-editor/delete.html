<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete — Mecoso Editor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap">
  <div class="dash-topbar">
    <a href="dashboard.html" class="logout-link">← Dashboard</a>
  </div>

  <div class="page-header">
    <div class="eyebrow">Delete</div>
    <h1>Find a Bag to Remove</h1>
    <div class="rule"></div>
  </div>

  <div class="manage-search">
    <input type="text" id="searchInput" placeholder="Search by bag name...">
  </div>

  <div class="manage-grid" id="grid"></div>
</div>

<div class="modal-overlay" id="passModal">
  <div class="modal-box">
    <h3>Confirm Deletion</h3>
    <div class="sub" id="deleteTargetName">Enter the password to remove this bag.</div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="deletePassword">
    </div>
    <div class="modal-error" id="deleteError">Incorrect password.</div>
    <div class="modal-actions">
      <button class="btn-ghost" id="passCancelBtn">Cancel</button>
      <button class="btn-gold-full" id="passConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deletedModal">
  <div class="modal-box">
    <div class="checkmark-circle" style="margin:0 auto 20px; border-color:#a8455a;">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#e08a8a"/></svg>
    </div>
    <h3>Bag Removed</h3>
    <div class="sub">It has been taken off the website.</div>
    <button class="btn-gold-full" id="deletedOkBtn">Done</button>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script>
  requireLogin();

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  let targetId = null;

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const products = getProducts().filter(p => p.name.toLowerCase().includes(q));
    if (!products.length) {
      grid.innerHTML = '<div class="no-results">No bags found.</div>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="manage-card">
        <div class="img-wrap"><img src="${p.img}" alt="${p.name}"></div>
        <div class="m-info">
          <div class="m-cat">${p.categoryLabel || p.category}</div>
          <h4>${p.name}</h4>
          <div class="m-price">${formatNaira(p.price)}</div>
          <button class="btn-outline" style="border-color:#a8455a; color:#e08a8a" onclick="openDelete('${p.id}', '${p.name.replace(/'/g, "\\'")}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function openDelete(id, name) {
    targetId = id;
    document.getElementById('deleteTargetName').textContent = `Enter the password to remove "${name}".`;
    document.getElementById('deletePassword').value = '';
    document.getElementById('deleteError').style.display = 'none';
    document.getElementById('passModal').classList.add('open');
  }

  document.getElementById('passCancelBtn').addEventListener('click', () => {
    document.getElementById('passModal').classList.remove('open');
  });

  document.getElementById('passConfirmBtn').addEventListener('click', () => {
    const pw = document.getElementById('deletePassword').value;
    if (pw !== EDITOR_PASSWORD) {
      document.getElementById('deleteError').style.display = 'block';
      return;
    }
    const ok = deleteProduct(targetId);
    if (!ok) {
      const err = document.getElementById('deleteError');
      err.textContent = "Couldn't delete — your browser's storage may be full. Try clearing old data or use a different browser profile.";
      err.style.display = 'block';
      return;
    }
    document.getElementById('passModal').classList.remove('open');
    document.getElementById('deletedModal').classList.add('open');
    render();
  });

  document.getElementById('deletedOkBtn').addEventListener('click', () => {
    document.getElementById('deletedModal').classList.remove('open');
  });

  searchInput.addEventListener('input', render);
  render();
</script>
</body>
</html>
